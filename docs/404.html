<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script>
        // Single Page App redirect fallback for GitHub Pages
        const pathSegmentsToKeep = 1; // Adjust based on your repo name depth (/test2/ is 1 segment)
        const l = window.location;
        const segmentCount = l.pathname.split('/').slice(1, -1).length;
        
        if (segmentCount >= pathSegmentsToKeep) {
            const redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                '/' + l.pathname.split('/')[1] + '/?p=/' + redirectPath + 
                (l.search ? '&q=' + l.search.slice(1) : '') + l.hash
            );
        }
    </script>
</head>
<body></body>
</html>
