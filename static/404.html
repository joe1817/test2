<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#121212">
    <title>Redirecting...</title>
	<style>
		:root, html, body {
			background-color: #121212;
			color-scheme: dark;
		}
		body {
			background-color: #121212;
			min-height: 100vh;
			margin: 0;
		}
	</style>
    <script>
        // Single Page App redirect fallback for GitHub Pages
        const pathSegmentsToKeep = 1; // repo name depth (/test2/ is 1 segment)
        const l = window.location;
        const segmentCount = l.pathname.split('/').slice(1, -1).length;

        if (segmentCount >= pathSegmentsToKeep) {
            const redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                '/' + l.pathname.split('/')[1] + '/?p=/' + redirectPath +
                (l.search ? '&q=' + l.search.slice(1) : '') + l.hash
            );
        }
    </script>
</head>
<body></body>
</html>
