name: Compile and Deploy Website

# Trigger this workflow whenever you push to the main branch
on:
  push:
    branches:
      - main

# Give the workflow permissions to commit changes back to the repository
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Website Files
        run: |
          python3 generate_site.py

      - name: Commit and Push Generated Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/
          git diff --quiet && git diff --cached --quiet || git commit -m "Automated build: Compile website output"
          git push